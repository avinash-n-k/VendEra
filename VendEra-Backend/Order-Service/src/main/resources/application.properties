spring.application.name=Order-Service

server.port=8763

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

resilience4j.retry.instances.productService.max-attempts=3

resilience4j.retry.instances.productService.wait-duration=1s

resilience4j.ratelimiter.instances.productService.limit-for-period=5

resilience4j.ratelimiter.instances.productService.timeout-duration=0s

resilience4j.ratelimiter.instances.productService.limit-refresh-period=10s

management.endpoints.web.exposure.include=health,info,metrics



spring.cloud.openfeign.client.config.Product-Service.connectTimeout=3000

spring.cloud.openfeign.client.config.Product-Service.readTimeout=3000



spring.datasource.url=jdbc:mysql://localhost:3306/order_db_outbox
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/order_db_outbox

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=localhost:29092



#to convert the java object into json before sending it to kafka

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer



spring.kafka.consumer.group-id=order-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


jwt.secret=${JWT_SECRET}