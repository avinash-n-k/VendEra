spring.application.name=Api-Gateway


server.port=8080
spring.cloud.gateway.server.webmvc.routes[0].id=product-route
#spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8762
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://Product-Service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=AddRequestHeader=X-Gateway-Request,true
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=AddResponseHeader=X-Gateway-Response,true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
logging.level.org.springframework.security=DEBUG

spring.cloud.gateway.server.webmvc.routes[1].id=order-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://Order-Service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/orders/**


spring.cloud.gateway.server.webmvc.routes[2].id=auth-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://Auth-Service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[3].id=admin-product-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://Product-Service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/admin/products/**

spring.cloud.gateway.server.webmvc.routes[4].id=admin-order-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://Order-Service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/admin/orders/**


spring.cloud.gateway.server.webmvc.routes[5].id=admin-payment-route
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://Payment-Service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/admin/payments/**


spring.cloud.gateway.server.webmvc.routes[6].id=payment-route
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://Payment-Service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/payments/**


jwt.secret=${JWT_SECRET}
