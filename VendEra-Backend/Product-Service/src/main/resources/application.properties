## Find Config Server through Eureka

#spring.cloud.config.discovery.enabled=true

#
## Tell Config Client to use discovery instead of a fixed URL

#spring.config.import=optional:configserver:



spring.datasource.url=jdbc:mysql://localhost:3306/product_db_outbox

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



#spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.bootstrap-servers=localhost:29092



# =========================
# Kafka Consumer
# =========================

spring.kafka.consumer.group-id=product-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer



# =========================
# Kafka Producer
# =========================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer