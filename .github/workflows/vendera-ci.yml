name: VendEra CI

on:
  push:
    branches:
      - main

jobs:
  test-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Eureka Server
        working-directory: ./VendEra-Backend/Eureka-Server
        run: ./mvnw clean package -DskipTests